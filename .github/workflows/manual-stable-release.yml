name: Manual Stable Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Input version tag exactly (e.g. 26.03 or 26.03.01)'
        required: true
      merge_upstream:
        description: 'Merge from upstream before building'
        type: boolean
        default: true

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream
        if: ${{ inputs.merge_upstream }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wxxsfxyzm/InstallerX-Revived.git
          git fetch upstream main
          echo "Merging upstream/main into current branch..."
          if ! git merge upstream/main --no-edit; then
            echo "❌ Merge conflict detected! Please resolve conflicts locally and try again."
            git merge --abort
            exit 1
          fi
          echo "✅ Successfully merged upstream/main"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Accept the terms of use to suppress the caching licensing warning
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Cache is read-only for manual stable releases
          cache-read-only: true

      - name: Verify Keystore
        run: |
          if [ -z "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" ]; then
            echo "ERROR: SIGNING_KEY_STORE_BASE64 secret is missing"
            exit 1
          fi

      - name: Setup Signing Keys
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
            exit 0
          fi
          mkdir -p keystore
          echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
          echo "storeFile=keystore/carlyu.jks" > keystore.properties
          echo "keyAlias=${SIGNING_KEY_ALIAS}" >> keystore.properties
          echo "keyPassword=${SIGNING_KEY_PASSWORD}" >> keystore.properties
          echo "storePassword=${SIGNING_STORE_PASSWORD}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set Version
        id: version
        run: |
          # 使用日期生成 version code: YYYYMMDD 格式
          # 例如 2026-08-09 -> 20260809
          VERSION_CODE=$(date +%Y%m%d)
          BUILD_DATE=$(date +%Y%m%d)

          # Version name 格式: 用户输入的 tag (日期)
          # 例如: 222222.33 (20260809)
          VERSION_TAG="${{ inputs.version_tag }}"
          VERSION_NAME="${VERSION_TAG} (${BUILD_DATE})"

          echo "本次 Version Name: $VERSION_NAME"
          echo "本次 Version Code: $VERSION_CODE"

          # 写入 build.gradle.kts（替换函数调用为数字字面量）
          perl -pi -e "s/versionCode\s*=\s*.+/versionCode = $VERSION_CODE/g" app/build.gradle.kts
          perl -pi -e 's/versionName\s*=\s*.+/versionName = "'"$VERSION_NAME"'"/g' app/build.gradle.kts

          # 输出版本号供后续步骤使用
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

          # 在日志中醒目显示版本号
          echo "=============================================="
          echo "  APK 版本号: ${VERSION_NAME} [Code: ${VERSION_CODE}]"
          echo "=============================================="
          echo "apk_version=${VERSION_NAME} [Code: ${VERSION_CODE}]" >> $GITHUB_STEP_SUMMARY

      - name: Build Stable Release APKs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Building APK with package: com.android.packageinstaller"
          ./gradlew assembleOnlineStableRelease -PAPP_ID=com.android.packageinstaller -Porg.gradle.java.installations.auto-download=false

          echo "Building APK with package: com.google.android.packageinstaller"
          ./gradlew assembleOnlineStableRelease -PAPP_ID=com.google.android.packageinstaller -Porg.gradle.java.installations.auto-download=false

      - name: Find and Rename APKs
        id: rename_apk
        run: |
          PROJECT_NAME="InstallerX-Revived"
          APK_DIR="app/build/outputs/apk/onlineStable/release/"

          # 查找所有 APK 文件
          APKS=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk")

          if [ -z "$APKS" ]; then
            echo "ERROR: No APK found in $APK_DIR!"
            ls -R app/build/outputs/apk
            exit 1
          fi

          # 重命名并识别两个包
          ANDROID_APK=""
          GOOGLE_APK=""

          for apk in $APKS; do
            # 使用 aapt 或文件名判断包名（这里假设构建顺序固定）
            # 第一个构建的是 com.android.packageinstaller
            # 第二个构建的是 com.google.android.packageinstaller

            if [ -z "$ANDROID_APK" ]; then
              NEW_NAME="${PROJECT_NAME}-android.apk"
              NEW_PATH="${APK_DIR}${NEW_NAME}"
              echo "Renaming $apk -> $NEW_PATH (com.android.packageinstaller)"
              mv "$apk" "$NEW_PATH"
              ANDROID_APK="$NEW_PATH"
            elif [ -z "$GOOGLE_APK" ]; then
              NEW_NAME="${PROJECT_NAME}-google.apk"
              NEW_PATH="${APK_DIR}${NEW_NAME}"
              echo "Renaming $apk -> $NEW_PATH (com.google.android.packageinstaller)"
              mv "$apk" "$NEW_PATH"
              GOOGLE_APK="$NEW_PATH"
            fi
          done

          echo "android_apk=${ANDROID_APK}" >> $GITHUB_OUTPUT
          echo "google_apk=${GOOGLE_APK}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "InstallerX Revived stable ${{ inputs.version_tag }}"
          # Use the exact input as the tag name
          tag_name: ${{ inputs.version_tag }}
          # Publish as draft so you can manually write the changelog and publish it later
          draft: true
          prerelease: false
          # Explicitly prevent GitHub from auto-generating release notes in the body
          generate_release_notes: false
          files: |
            ${{ steps.rename_apk.outputs.android_apk }}
            ${{ steps.rename_apk.outputs.google_apk }}

      - name: Push Version Code Tag
        run: |
          git tag "version-code-${{ steps.version.outputs.version_code }}"
          git push origin "version-code-${{ steps.version.outputs.version_code }}"

      - name: Upload to Telegram
        continue-on-error: true
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_CI_SESSION: ${{ secrets.BOT_CI_SESSION }}
        run: |
          pip3 install telethon
          echo "Uploading both APKs as a group..."
          python3 .github/bot.py "${{ steps.rename_apk.outputs.android_apk }}" "${{ steps.rename_apk.outputs.google_apk }}"
